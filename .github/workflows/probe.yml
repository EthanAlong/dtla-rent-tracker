name: Probe candidate buildings

# Manual only. Runs scraper/probe.js against a list of leasing sites and
# prints, per site, which adapter can track it (SightMap embed id, Onni Craft
# page, server-rendered prices, or "needs a browser") plus any concession
# banner text with a CSS selector. Useful when your own network can't reach
# the sites, or just to check a comp before adding it to config.
#
# Also runs automatically when the probe, the adapters or the building list
# change, so a config edit gets validated (DRY=1, nothing written) before the
# next real scrape.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated site URLs to probe (blank = the default candidate list below)"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/probe.yml"
      - "scraper/**"
      - "config/properties.json"

env:
  DEFAULT_URLS: >-
    https://hopeflowerdtla.com
    https://liveatapexalina.com
    https://www.hollandresidential.com/ca/los-angeles/apex-the-one
    https://www.verdosaapts.com
    https://theadtla.com
    https://www.parkfifthtower.com
    https://www.windsorcommunities.com/properties/olympic-by-windsor/
    https://www.theemersonla.com
    https://www.onyxdtla.com
    https://www.leveldtla.com
    https://www.broadwaypalace.com
    https://www.thegraceonspring.com
    https://www.griffinonspring.com
    https://www.wrendtla.com
    https://www.eongrand.com
    https://www.avendtla.com
    https://www.perlaonbroadway.com
    https://www.metropolislosangeles.com

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Probe
        run: node scraper/probe.js ${{ inputs.urls || env.DEFAULT_URLS }}
      - name: Dry-run scraper against config
        run: DRY=1 npm run track
